# ===== 服务发现与容错网关配置 =====

# 负载分发策略：ROUND_ROBIN / RANDOM
gateway.policy=ROUND_ROBIN
# 单次下游调用超时预算（毫秒）
gateway.timeout-millis=1000
# 可安全重试请求的最大尝试次数（含首次）
gateway.max-attempts=3
# 重试退避间隔（毫秒），用于削平重试压力
gateway.retry-backoff-millis=50

# 熔断器：连续失败次数阈值、打开持续时长（毫秒）
gateway.circuit-failure-threshold=3
gateway.circuit-open-duration-millis=2000

# 健康探测：连续失败摘除阈值、探测周期、探测超时、摘除隔离时长（毫秒）
gateway.health-failure-threshold=2
gateway.health-probe-interval-millis=1000
gateway.health-timeout-millis=500
gateway.evict-duration-millis=5000
gateway.health-check-enabled=true

# 本地演示端口
server.port=8080
